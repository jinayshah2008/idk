<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JIYANDORUNS - THE DINOSAUR VERSION</title>
<style>
  :root{
    --shale-950:#16110f;
    --shale-900:#1d1714;
    --shale-800:#2b241f;
    --shale-700:#40362d;
    --bone:#ede6d6;
    --bone-dim:#beb3a0;
    --amber:#d59a3d;
    --rust:#a64a35;
    --moss:#61744b;
    --teal:#5da6a0;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:radial-gradient(circle at 50% 0%, #2b241f 0%, var(--shale-950) 68%);
    color:var(--bone);
    font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage{
    width:100%;
    max-width:940px;
    padding:18px;
  }
  .frame{
    border:1px solid var(--shale-700);
    background:var(--shale-800);
    box-shadow:0 0 0 6px var(--shale-950), 0 20px 60px rgba(0,0,0,0.5);
    position:relative;
  }
  .hud{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:16px 20px 10px;
    border-bottom:1px solid var(--shale-700);
    gap:16px;
  }
  .era-label{
    font-family:Georgia, "Times New Roman", serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .era-sub{
    font-size:11px;
    color:var(--bone-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-top:2px;
  }
  .mya{
    text-align:right;
  }
  .mya-num{
    font-family:"Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    font-weight:700;
    font-size:26px;
    color:var(--bone);
    font-variant-numeric:tabular-nums;
  }
  .mya-label{
    font-size:10px;
    color:var(--bone-dim);
    letter-spacing:1.5px;
    text-transform:uppercase;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
    background:linear-gradient(180deg, #30302d 0%, #2d2923 48%, #211a16 100%);
    cursor:pointer;
  }
  .footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    font-size:11px;
    color:var(--bone-dim);
    letter-spacing:0.5px;
    border-top:1px solid var(--shale-700);
    gap:12px;
  }
  .kbd{
    display:inline-block;
    border:1px solid var(--shale-700);
    background:var(--shale-900);
    color:var(--bone-dim);
    padding:1px 6px;
    border-radius:3px;
    font-family:"Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    font-size:10px;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:rgba(29,23,20,0.86);
    text-align:center;
    padding:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  .overlay.show{
    opacity:1;
    pointer-events:all;
  }
  .overlay h1{
    font-family:Georgia, "Times New Roman", serif;
    font-weight:800;
    color:var(--rust);
    font-size:34px;
    margin:0 0 6px;
    letter-spacing:1px;
  }
  .overlay p{
    margin:0 0 18px;
    color:var(--bone-dim);
    font-size:13px;
    letter-spacing:0.5px;
  }
  .score-final{
    font-family:"Cascadia Mono", "JetBrains Mono", Consolas, monospace;
    color:var(--amber);
    font-size:18px;
    margin-bottom:20px;
  }
  button.restart{
    font-family:Georgia, "Times New Roman", serif;
    font-weight:800;
    letter-spacing:1px;
    background:var(--amber);
    color:var(--shale-950);
    border:none;
    padding:12px 28px;
    font-size:14px;
    cursor:pointer;
    text-transform:uppercase;
  }
  button.restart:hover{
    background:var(--teal);
  }
  .start-hint{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .start-hint span{
    font-family:Georgia, "Times New Roman", serif;
    font-weight:700;
    color:var(--bone);
    background:rgba(29,23,20,0.64);
    padding:10px 18px;
    letter-spacing:1px;
    font-size:14px;
    text-transform:uppercase;
  }
</style>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="stage">
  <div class="frame">
    <div class="hud">
      <div>
        <div class="era-label" id="eraLabel">Jiyando</div>
        <div class="era-sub" id="eraSub">2008-till date</div>
      </div>
      <div class="mya">
        <div class="mya-num" id="scoreNum">0000</div>
        <div class="mya-label">Distance Run (M)</div>
      </div>
    </div>
    <div style="position:relative;">
      <canvas id="game" width="860" height="420"></canvas>
      <div class="start-hint" id="startHint"><span>Tap or press Space to begin</span></div>
      <div class="overlay" id="overlay">
        <h1>Extinction Event</h1>
        <p>The record ends here. Every run becomes strata.</p>
        <div class="score-final" id="finalScore">0000 M covered</div>
        <button class="restart" id="restartBtn">Run Again</button>
      </div>
    </div>
    <div class="footer">
      <span>JIYANDO RUN</span>
      <span><span class="kbd">SPACE</span> jump &middot; <span class="kbd">DOWN</span> duck</span>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;
const GROUND_Y = 338;

const runnerImg = new Image();
let runnerReady = false;
runnerImg.onload = () => { runnerReady = true; };
runnerImg.src = "runner-sprites.png";

const SPRITE_CELL_W = 170;
const SPRITE_CELL_H = 271;
const SPRITE = {
  run1: 0,
  run2: 1,
  run3: 2,
  jump: 3,
  air: 4,
  land: 5,
  duck: 6
};
const RUN_FRAMES = [SPRITE.run1, SPRITE.run2, SPRITE.run3];
const SPRITE_HITBOXES = [
  {x:43, y:74, w:86, h:174},
  {x:44, y:74, w:82, h:174},
  {x:39, y:62, w:78, h:172},
  {x:45, y:48, w:84, h:196},
  {x:37, y:26, w:82, h:166},
  {x:34, y:70, w:76, h:180},
  {x:42, y:116, w:70, h:142}
];
const SPRITE_BOUNDS = [
  {x:13, y:49, w:150, h:220, bottom:269},
  {x:14, y:49, w:141, h:219, bottom:268},
  {x:9, y:37, w:138, h:221, bottom:258},
  {x:15, y:24, w:145, h:239, bottom:263},
  {x:7, y:2, w:140, h:202, bottom:204},
  {x:4, y:46, w:131, h:224, bottom:270},
  {x:15, y:98, w:123, h:173, bottom:271}
];

const eras = [
  {name:"Triassic", sub:"252 - 201 MYA", threshold:0},
  {name:"Jurassic", sub:"201 - 145 MYA", threshold:400},
  {name:"Cretaceous", sub:"145 - 66 MYA", threshold:900},
  {name:"Quaternary", sub:"2.6 MYA - Now", threshold:1600}
];

let state = "idle";
let score = 0;
let speed = 6;
let frame = 0;
let groundOffset = 0;

const strataBands = [
  {h:18, color:"#4a3d30"},
  {h:24, color:"#3a2f26"},
  {h:30, color:"#2e251e"},
  {h:38, color:"#241c17"}
];

const fossils = [];
for(let i = 0; i < 14; i++){
  fossils.push({
    x: Math.random() * 2400,
    bandIdx: Math.floor(Math.random() * 3),
    r: 3 + Math.random() * 4
  });
}

const runner = {
  x: 56,
  y: GROUND_Y,
  vy: 0,
  jumping: false,
  ducking: false,
  duckHeld: false,
  duckTimer: 0,
  runPhase: 0,
  landTimer: 0
};

const GRAVITY = 0.58;
const JUMP_V = -10.8;
let obstacles = [];
let nextSpawn = 60;

function currentEra(){
  let e = eras[0];
  for(const era of eras){
    if(score >= era.threshold) e = era;
  }
  return e;
}

function reset(){
  score = 0;
  speed = 6;
  frame = 0;
  groundOffset = 0;
  runner.y = GROUND_Y;
  runner.vy = 0;
  runner.jumping = false;
  runner.ducking = false;
  runner.duckHeld = false;
  runner.duckTimer = 0;
  runner.runPhase = 0;
  runner.landTimer = 0;
  obstacles = [];
  nextSpawn = 60;
  state = "idle";
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("startHint").style.display = "flex";
  updateHUD();
}

function updateHUD(){
  const era = currentEra();
  document.getElementById("eraLabel").textContent = era.name;
  document.getElementById("eraSub").textContent = era.sub;
  document.getElementById("scoreNum").textContent = String(Math.floor(score)).padStart(4, "0");
}

function startGame(){
  if(state === "running") return;
  if(state === "over") reset();
  state = "running";
  document.getElementById("startHint").style.display = "none";
}

function jump(){
  if(state === "idle"){
    startGame();
    return;
  }
  if(state === "over"){
    reset();
    return;
  }
  if(!runner.jumping && !runner.ducking){
    runner.vy = JUMP_V;
    runner.jumping = true;
    runner.landTimer = 0;
  }
}

function duckStart(){
  if(state === "idle"){
    startGame();
    return;
  }
  if(!runner.jumping){
    runner.ducking = true;
    runner.duckHeld = true;
    runner.duckTimer = 14;
  }
}

function duckEnd(){
  runner.duckHeld = false;
}

function spawnObstacle(){
  const flying = Math.random() < 0.28 && score > 150;
  if(flying){
    obstacles.push({type:"pterosaur", x:W + 20, y:GROUND_Y - 138, w:42, h:28});
  } else {
    const kind = Math.random() < 0.34 ? "rock" : "fern";
    const w = kind === "rock" ? 30 : 25;
    const h = kind === "rock" ? 34 : 44;
    obstacles.push({type:kind, x:W + 20, y:GROUND_Y - h, w, h});
  }
}

function rectsOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function runnerHitBox(){
  const spriteIndex = currentRunnerFrame();
  const box = SPRITE_HITBOXES[spriteIndex];
  const bounds = SPRITE_BOUNDS[spriteIndex];
  return {
    x: runner.x + box.x,
    y: runner.y - bounds.bottom + box.y,
    w: box.w,
    h: box.h
  };
}

function update(){
  frame++;
  if(state !== "running") return;

  score += speed * 0.045;
  speed = 6 + score * 0.0035;
  groundOffset = (groundOffset + speed) % 40;

  runner.vy += GRAVITY;
  runner.y += runner.vy;
  if(runner.y > GROUND_Y){
    runner.y = GROUND_Y;
    runner.vy = 0;
    if(runner.jumping) runner.landTimer = 10;
    runner.jumping = false;
  }
  if(!runner.jumping && !runner.ducking){
    runner.runPhase += speed * 0.045;
  }
  if(runner.jumping){
    runner.ducking = false;
    runner.duckHeld = false;
    runner.duckTimer = 0;
  }
  if(runner.ducking && !runner.duckHeld){
    runner.duckTimer--;
    if(runner.duckTimer <= 0) runner.ducking = false;
  }
  if(runner.landTimer > 0) runner.landTimer--;

  nextSpawn--;
  if(nextSpawn <= 0){
    spawnObstacle();
    nextSpawn = Math.max(45, 95 - score * 0.05) + Math.random() * 40;
  }
  for(const o of obstacles){
    o.x -= speed;
  }
  obstacles = obstacles.filter(o => o.x > -80);

  const body = runnerHitBox();
  for(const o of obstacles){
    if(rectsOverlap(body, o)){
      state = "over";
      document.getElementById("finalScore").textContent = String(Math.floor(score)).padStart(4, "0") + " M covered";
      document.getElementById("overlay").classList.add("show");
    }
  }
  updateHUD();
}

function drawStrata(){
  let y = GROUND_Y + 2;
  for(const band of strataBands){
    ctx.fillStyle = band.color;
    ctx.fillRect(0, y, W, band.h);
    y += band.h;
  }

  ctx.strokeStyle = "rgba(213,154,61,0.20)";
  ctx.lineWidth = 1;
  let yy = GROUND_Y + 2;
  for(const band of strataBands){
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(W, yy);
    ctx.stroke();
    yy += band.h;
  }

  ctx.fillStyle = "rgba(237,230,214,0.24)";
  for(const f of fossils){
    let bandY = GROUND_Y + 2;
    for(let i = 0; i < f.bandIdx; i++) bandY += strataBands[i].h;
    bandY += strataBands[f.bandIdx].h / 2;
    let sx = (f.x - groundOffset * 3) % (W + 200);
    if(sx < -50) sx += W + 250;
    ctx.beginPath();
    ctx.ellipse(sx, bandY, f.r, f.r * 0.6, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.fillStyle = "#4a3d30";
  ctx.fillRect(0, GROUND_Y - 4, W, 4);
  ctx.strokeStyle = "rgba(237,230,214,0.17)";
  for(let x = -groundOffset; x < W; x += 40){
    ctx.beginPath();
    ctx.moveTo(x, GROUND_Y);
    ctx.lineTo(x - 8, GROUND_Y + 8);
    ctx.stroke();
  }
}

function currentRunnerFrame(){
  if(runner.ducking) return SPRITE.duck;
  if(runner.jumping){
    if(runner.vy < -2) return SPRITE.jump;
    return SPRITE.air;
  }
  if(runner.landTimer > 0) return SPRITE.land;
  if(state === "running") return RUN_FRAMES[Math.floor(runner.runPhase) % RUN_FRAMES.length];
  return SPRITE.run2;
}

window.__strataDebug = () => ({
  state,
  score: Math.round(score),
  y: Math.round(runner.y),
  ready: runnerReady,
  frame: currentRunnerFrame()
});

function drawRunner(){
  const spriteIndex = currentRunnerFrame();
  const bounds = SPRITE_BOUNDS[spriteIndex];
  const bob = (!runner.jumping && !runner.ducking && state === "running")
    ? Math.round(Math.sin(runner.runPhase * Math.PI) * 1)
    : 0;
  const sx = spriteIndex * SPRITE_CELL_W + bounds.x;
  const sy = bounds.y;
  const dx = Math.round(runner.x + bounds.x);
  const dy = Math.round(runner.y - bounds.h + bob);

  if(runnerReady){
    ctx.drawImage(
      runnerImg,
      sx,
      sy,
      bounds.w,
      bounds.h,
      dx,
      dy,
      bounds.w,
      bounds.h
    );
  }
}

function drawObstacle(o){
  ctx.fillStyle = o.type === "rock" ? "#615950" : (o.type === "pterosaur" ? "#a64a35" : "#61744b");
  if(o.type === "pterosaur"){
    const flap = Math.sin(frame * 0.25) * 7;
    ctx.beginPath();
    ctx.moveTo(o.x + o.w / 2, o.y + 11);
    ctx.lineTo(o.x, o.y + flap);
    ctx.lineTo(o.x + o.w / 2, o.y + 17);
    ctx.lineTo(o.x + o.w, o.y + flap);
    ctx.closePath();
    ctx.fill();
  } else if(o.type === "rock"){
    ctx.beginPath();
    ctx.moveTo(o.x, o.y + o.h);
    ctx.lineTo(o.x + 5, o.y + 5);
    ctx.lineTo(o.x + o.w - 5, o.y + 2);
    ctx.lineTo(o.x + o.w, o.y + o.h);
    ctx.closePath();
    ctx.fill();
  } else {
    for(let i = 0; i < 3; i++){
      ctx.beginPath();
      ctx.ellipse(o.x + o.w / 2, o.y + o.h - i * 12, 12 - i * 2, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillRect(o.x + o.w / 2 - 2, o.y + 10, 4, o.h - 10);
  }
}

function draw(){
  canvas.dataset.gameState = state;
  canvas.dataset.runnerFrame = String(currentRunnerFrame());
  canvas.dataset.score = String(Math.floor(score));

  ctx.clearRect(0, 0, W, H);
  drawStrata();
  for(const o of obstacles){
    drawObstacle(o);
  }
  drawRunner();

  if(state === "over"){
    ctx.fillStyle = "rgba(166,74,53,0.08)";
    ctx.fillRect(0, 0, W, H);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener("keydown", (e) => {
  if(e.code === "Space"){
    e.preventDefault();
    jump();
  }
  if(e.code === "ArrowDown"){
    e.preventDefault();
    duckStart();
  }
});
window.addEventListener("keyup", (e) => {
  if(e.code === "ArrowDown") duckEnd();
});
canvas.addEventListener("mousedown", jump);
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  jump();
}, {passive:false});
document.getElementById("restartBtn").addEventListener("click", reset);

reset();
loop();
</script>
</body>
</html>
